<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="shortcut icon" href="assets/icon/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
    <title>BBONZI</title>
</head>
<body class="page page--contact">
    
    <!-- 네비게이션 인클루드 -->
    <div w3-include-html="include/header.html"></div>

    

    <section class="section contact">
        <h1 class="contact__title text-title">Contact</h1>
        <p class="conatct__text text-base">
            함께 성장할 수 있는 팀을 찾고 있습니다. <br>
            협업 제안이나 프로젝트 문의는 언제든 환영합니다.
        </p>
        <ul class="contact__list">
            <li class="contact__item">
                <a href="https://github.com/bb0nzii" class="contact__link" target="_blank">
                    <img src="./assets/icon/github.svg" class="icon-md contact__icon"></img>
                    <p class="contact__description text-base">Github 바로가기</p>
                </a>
            </li>
            <li class="contact__item">
                <a href="" class="contact__link" target="_blank">
                    <img src="./assets/icon/youtube.svg" class="icon-md contact__icon"></img>
                    <p class="contact__description text-base">유튜브 바로가기</p>
                </a>
            </li>
            <li class="contact__item">
                <a href="mailto:poplar159@naver.com" class="contact__link" target="_blank">
                    <img src="./assets/icon/email.svg" class="icon-md contact__icon"></img>
                    <p class="contact__description text-base">Email 보내기</p>
                </a>
            </li>
        </ul>
    </section>

    <section class="section faq">
        <h1 class="faq__title text-title">FAQ</h1>
        <div class="accordion" id="faqAccordion"></div>
    </section>


    <!-- Scroll Top -->
    <div w3-include-html="include/scroll-top.html"></div>



    <!-- 푸터 인클루드 -->
    <div w3-include-html="include/footer.html"></div>
    
    
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
